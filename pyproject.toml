[project]
name = "pysynthbio"
version = "4.3.0"
requires-python = ">=3.10"
description = "A package to retrieve data and models from Synthesize Bio's API"
authors = [
    { name = "Alex David" },
    { name = "Candace Savonen" },
]
readme = "README.md"
license = "MIT"
dependencies = [
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "requests",
    "keyring>=23.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/synthesizebio/pysynthbio"
Issues = "https://github.com/synthesizebio/pysynthbio/issues"

[tool.uv]
# cryptography is a transitive dependency (keyring -> SecretStorage on Linux).
# Constrain it to the latest 46.x to pick up security fixes while staying on the
# 46 line (avoids a future lock silently jumping to a 47.x major). Bump the upper
# bound deliberately when adopting cryptography 47.
constraint-dependencies = ["cryptography>=46.0.7,<47"]

[project.optional-dependencies]
# Core optional dependencies - similar to R options
secure = [
    "keyring>=23.0.0",
]
# Talking to a self-hosted model container that streams Apache Arrow.
self_hosted = [
    "pyarrow>=15.0.0",
]
# Install all optional dependencies
all = [
    "keyring>=23.0.0",
    "pyarrow>=15.0.0",
]
# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff",
    "mypy",
    "black>=26.3.1",
    "build",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["pysynthbio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[[tool.mypy.overrides]]
module = ["setuptools", "pandas-stubs", "requests", "keyring"]
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310']

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W"]
ignore = []
